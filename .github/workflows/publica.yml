# Feeds a GitHub Pages: las piezas y el CSV viven en este mismo repo y se sirven por Pages.
# En el repo va como .github/workflows/publica.yml (lo copia motor/armar-repo.js).
#
# Se acabó el ZIP: cada feed tiene una URL fija que se sobrescribe en cada corrida
#   https://<dueño>.github.io/<repo>/<tienda>/<nombre>/feed.csv
# Esa URL se pega UNA vez en el catálogo de Meta (o TikTok) y ya no se toca nunca más.
#
# Tres pasos, como en el sistema que ya lleva meses funcionando:
#   recetas  → qué feeds tocan esta hora y en cuántas partes se reparte cada uno
#   dibujar  → N máquinas en paralelo; cada una dibuja SOLO las piezas que faltan (caché = estado.json)
#   unir     → una sola máquina junta las partes, escribe el CSV, poda y hace UN commit
# Solo «unir» empuja: si empujaran las partes se pisarían entre ellas.
#
# Antes de la primera corrida: Settings > Pages > Source: Deploy from a branch, Branch: main, carpeta /docs.
name: Feeds a Pages

on:
  schedule:
    # Dos veces por hora a propósito: GitHub retrasa o se salta corridas programadas cuando está
    # cargado (el 2026-09-23 disparó solo 3 de 24 en un día, a las :24, :32 y :14), así que la
    # elección de qué toca ya no es «la hora exacta» sino «qué hora programada venció y todavía
    # no se publicó» (ver el job recetas). Cada disparo de más cuesta segundos.
    - cron: '0 * * * *'
    - cron: '30 * * * *'
  # «Actualizar ahora» desde el panel «Mis feeds»: el servidor local escribe auto/ahora.json con el
  # feed pedido y empuja. Ese empujón dispara esta corrida al instante, sin secretos ni token.
  push:
    paths:
      - 'auto/ahora.json'
  workflow_dispatch:
    inputs:
      slug:
        description: 'tienda/nombre (vacío = las que tocan esta hora)'
        required: false
      partes:
        description: 'en cuántas partes repartir (vacío = lo que diga la receta)'
        required: false
      limite:
        description: 'solo los primeros N productos (vacío = todo el catálogo). Para la primera prueba.'
        required: false

# Para el commit de las piezas alcanza el token que GitHub da solo: no hace falta ningún secreto.
permissions:
  contents: write

# Nunca dos corridas a la vez sobre el mismo repo: la segunda espera, no pisa.
concurrency:
  group: publica-pages
  cancel-in-progress: false

jobs:
  recetas:
    runs-on: ubuntu-latest
    outputs:
      matriz: ${{ steps.l.outputs.matriz }}
      feeds: ${{ steps.l.outputs.feeds }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Las recetas y el historial de cada feed (para saber si la hora que venció ya se publicó).
          # Sin cone: así entran solo esos JSON y no las decenas de miles de fotos de docs/.
          sparse-checkout: |
            auto/*
            auto/recetas/*
            auto/recetas/*/*
            docs/*/*/historial.json
          sparse-checkout-cone-mode: false
      - id: l
        env:
          SLUG_MANUAL: ${{ github.event.inputs.slug }}
          PARTES_MANUAL: ${{ github.event.inputs.partes }}
          EVENTO: ${{ github.event_name }}
        run: |
          export HORA=$(TZ=America/Lima date +%H:%M)
          echo "Hora de Lima: $HORA"
          node -e '
            const fs = require("fs"), path = require("path");
            const hora = process.env.HORA, manual = (process.env.SLUG_MANUAL || "").trim();
            const pManual = Number(process.env.PARTES_MANUAL) || 0;
            // «Actualizar ahora»: auto/ahora.json trae los feeds pedidos desde el panel. Se atiende solo
            // si el pedido es de hace menos de 6 h, para que un revert viejo no relance nada.
            let ahora = null;
            if (process.env.EVENTO === "push") {
              try {
                const p = JSON.parse(fs.readFileSync("auto/ahora.json", "utf8"));
                const t = Date.parse(p.pedido);
                if (Array.isArray(p.slugs) && p.slugs.length && t && Date.now() - t < 6 * 3600e3) ahora = new Set(p.slugs);
              } catch { /* sin pedido: no corre nada */ }
              if (!ahora) console.log("El empujón no trae ningún pedido vigente en auto/ahora.json");
            }
            // Una receta toca si alguna de sus horas (Lima, UTC-5 fijo: Perú no cambia de hora) venció
            // hace menos de VENTANA y el feed no se publicó desde entonces (historial.json de docs/).
            // Antes se exigía HORA === "07:00" exacta y GitHub casi nunca dispara en punto.
            const VENTANA = 6 * 3600e3, ahoraMs = Date.now();
            const [hh, mm] = hora.split(":").map(Number);
            const limaHoy = new Date(ahoraMs + (-5 * 3600e3)); limaHoy.setUTCHours(hh, mm, 0, 0);
            function vencida(slug, horas) {
              let ultima = 0;
              try { const h = JSON.parse(fs.readFileSync(path.join("docs", slug, "historial.json"), "utf8")); ultima = Date.parse((h.corridas || h)[0].cuando) || 0; } catch { /* nunca corrió */ }
              for (const hm of horas) {
                const [H, M] = String(hm).split(":").map(Number); if (isNaN(H) || isNaN(M)) continue;
                const p = new Date(limaHoy); p.setUTCHours(H, M, 0, 0);
                let prog = p.getTime() - (-5 * 3600e3);           // de vuelta a UTC real
                if (prog > ahoraMs) prog -= 24 * 3600e3;            // la de hoy no llegó: vale la de ayer
                if (ahoraMs - prog <= VENTANA && ultima < prog) { console.log(slug + ": venció " + hm + " y no se publicó desde entonces"); return true; }
              }
              return false;
            }
            const raiz = "auto/recetas", feeds = [], matriz = [];
            for (const t of fs.existsSync(raiz) ? fs.readdirSync(raiz, { withFileTypes: true }) : []) {
              if (!t.isDirectory()) continue;
              for (const f of fs.readdirSync(path.join(raiz, t.name))) {
                if (!f.endsWith(".json")) continue;
                const slug = t.name + "/" + f.slice(0, -5);
                let r; try { r = JSON.parse(fs.readFileSync(path.join(raiz, t.name, f), "utf8")); } catch { continue; }
                if (manual) { if (slug !== manual) continue; }
                else if (process.env.EVENTO === "push") { if (!ahora || !ahora.has(slug)) continue; }
                else {
                  if (r.activo === false) continue;
                  const horas = Array.isArray(r.horas) && r.horas.length ? r.horas : ["07:00", "15:00"];
                  if (!vencida(slug, horas)) continue;
                }
                // Tope de 20 jobs en paralelo en el plan gratuito; con 1 parte igual funciona (más lento).
                const de = Math.min(20, Math.max(1, pManual || Number(r.partes) || 8));
                feeds.push({ slug, de });
                for (let k = 0; k < de; k++) matriz.push({ slug, parte: k, de });
              }
            }
            const salida = process.env.GITHUB_OUTPUT;
            fs.appendFileSync(salida, "matriz=" + JSON.stringify(matriz) + "\n");
            fs.appendFileSync(salida, "feeds=" + JSON.stringify(feeds) + "\n");
            console.log(feeds.length ? feeds.map(f => f.slug + " en " + f.de + " partes").join("\n") : "Ninguna receta tiene una hora vencida sin publicar");
          '

  dibujar:
    needs: recetas
    if: needs.recetas.outputs.matriz != '[]'
    runs-on: ubuntu-latest
    # 45 min, no 330. Una parte sana termina en minutos (12 hilos, y solo dibuja lo que falta);
    # si una pasa de 45 es porque la tienda corto esa maquina, y lo util es que muera rapido para
    # que `reintenta.yml` pida otra maquina, no que se quede cuatro horas en pie.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        tarea: ${{ fromJson(needs.recetas.outputs.matriz) }}
    steps:
      # Lo más importante de todo: la copia NO se trae docs/**/img/. Son decenas de miles de fotos
      # y esta máquina no necesita ninguna: para saber qué ya existe le basta estado.json.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/docs/*/*/img/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fuentes (Arial se reemplaza por Liberation Sans, de las mismas medidas)
        run: sudo apt-get install -y -qq fonts-liberation > /dev/null
      - name: Dibujar
        env:
          LIMITE: ${{ github.event.inputs.limite }}
        run: |
          # Solo dígitos: lo que se escribe en el formulario nunca entra crudo en la línea de comandos.
          LIM=$(printf '%s' "$LIMITE" | tr -cd '0-9')
          node motor/publica.js "${{ matrix.tarea.slug }}" --parte ${{ matrix.tarea.parte }} --de ${{ matrix.tarea.de }} ${LIM:+--limite $LIM}
      - name: Guardar lo dibujado para el paso de unir
        # OJO con README.md: upload-artifact recorta la carpeta común de lo que sube. Sin un archivo
        # de la raíz, docs/<tienda>/<nombre>/ se pierde y al bajarlo las partes caen fuera de docs/.
        uses: actions/upload-artifact@v4
        with:
          name: parte-${{ strategy.job-index }}
          path: |
            README.md
            docs/*/*/img
            docs/*/*/partes
          if-no-files-found: error
          retention-days: 1

  unir:
    needs: [recetas, dibujar]
    if: ${{ always() && needs.recetas.outputs.matriz != '[]' && needs.dibujar.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Las piezas nuevas caen encima de docs/, junto a las que ya estaban.
      - uses: actions/download-artifact@v4
        with:
          pattern: parte-*
          path: .
          merge-multiple: true
      - name: Unir las partes y escribir el CSV
        env:
          FEEDS: ${{ needs.recetas.outputs.feeds }}
        run: |
          echo "$FEEDS" | node -e '
            let t = ""; process.stdin.on("data", d => t += d).on("end", () => {
              for (const f of JSON.parse(t)) console.log(f.slug + " " + f.de);
            });
          ' > lista.txt
          while read -r slug de; do
            node motor/publica.js "$slug" --unir --de "$de"
          done < lista.txt
          rm -f lista.txt
      - name: Un solo commit, un solo push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A docs
          git diff --cached --quiet && { echo "Nada cambió"; exit 0; }
          git commit -m "Feeds a Pages: $(TZ=America/Lima date '+%Y-%m-%d %H:%M') (Lima)"
          # Empujar 15 mil fotos tarda un minuto, y en ese minuto la Fabrica puede haber empujado
          # una receta: GitHub rechaza con «cannot lock ref ... is at X but expected Y» y se perdia
          # la corrida entera. Se reintenta: traer, reponer nuestro commit encima y volver a empujar.
          for intento in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "Push rechazado (intento $intento); me reengancho a lo que hay en GitHub"
            sleep $((intento * 10))
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort || true; git reset --hard "origin/${GITHUB_REF_NAME}"; exit 1; }
          done
          echo "No se pudo empujar despues de 5 intentos"; exit 1
